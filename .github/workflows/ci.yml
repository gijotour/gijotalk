name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: 타입 검사
        run: npm run lint

      - name: 테스트
        run: npm test

      - name: 빌드
        run: npm run build

      # 오디오는 macOS 의 `say` 로 만들기 때문에 리눅스 러너에서는 재생성할 수 없습니다.
      # 그래서 "커밋된 오디오가 문장 데이터와 맞는지"만 확인합니다.
      # 문장을 추가하고 `npm run audio` 를 잊은 채 배포하는 사고를 여기서 잡습니다.
      - name: 오디오 매니페스트 동기화 확인
        run: npm run audio:check
