<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>GIJO Tour — 지아이조 투어에서 제공하는 일정표 및 생활영어</title>
    <meta
      name="description"
      content="지아이조 투어에서 제공하는 일정표 및 생활영어. 인터넷 없이 오늘 일정과 현장 표현을 확인하세요."
    />

    <!-- PWA: 홈 화면 설치 -->
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <meta name="theme-color" content="#FF6B4A" />

    <!-- iOS 홈 화면 앱 -->
    <link rel="apple-touch-icon" href="%BASE_URL%icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GIJO Tour" />

    <link rel="icon" href="%BASE_URL%icon-192.png" type="image/png" />

    <!-- 공유 링크 미리보기 (문자/메일로 배포) -->
    <meta property="og:title" content="GIJO Tour — 지아이조 투어에서 제공하는 일정표 및 생활영어" />
    <meta
      property="og:description"
      content="지아이조 투어에서 제공하는 일정표 및 생활영어. 홈 화면에 추가해서 인터넷 없이 사용하세요."
    />
    <meta property="og:image" content="%BASE_URL%icon-512.png" />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- PWA: Service Worker 즉시 등록 (PWABuilder & Store 심사용) -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker
          .register('%BASE_URL%sw.js', { scope: '%BASE_URL%' })
          .then(function (reg) {
            console.log('[GIJO Tour] PWA Service Worker Ready:', reg.scope);
          })
          .catch(function (err) {
            console.warn('[GIJO Tour] SW Notice:', err);
          });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- 서비스워커 등록은 <head> 에서 한 번만 합니다(예전엔 여기서 한 번 더 등록해 로그가 두 줄씩 찍혔습니다). -->
  </body>
</html>
