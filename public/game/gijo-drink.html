<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIJO Drink - Party Game</title>
    <!-- 웹폰트를 렌더링 차단 없이 불러옵니다.
         원래 <link rel="stylesheet"> 그대로 두면, 이 문서 뒤쪽의 &lt;script&gt;가 폰트 요청이
         끝날 때까지 파싱을 멈춥니다. 평소엔 안 보이는 문제지만 현지 데이터가 느리거나
         요청이 걸려버리면(연결은 됐는데 응답이 안 오는 상태) 게임 화면 전체가 영원히
         빈 화면으로 멈춥니다 — 여행 중 이 앱을 쓰는 바로 그 상황입니다.
         preload 로 비동기로 받고, onload 때 rel 을 바꿔 스타일을 적용합니다.
         폰트가 끝내 안 와도 시스템 sans-serif 로 보일 뿐 게임은 그대로 동작합니다. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap"
          onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap"></noscript>
    <style>
:root {
    --bg-color: #111318;
    --surface-color: #1a1d24;
    --surface-hover: #222630;
    --border-subtle: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.16);
    --primary-neon: #ff4d6d;
    --secondary-neon: #e2e8f0;
    --tertiary-neon: #818cf8;
    --text-color: #f8fafc;
    --text-muted: #94a3b8;
    --font-main: 'Outfit', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: var(--font-main);
    overflow: hidden;
    height: 100%;
    width: 100%;
    position: fixed;
}

#app {
    width: 100%;
    height: 100dvh;
    position: relative;
    z-index: 1;
    max-width: 520px;
    margin: 0 auto;
}

.aurora-bg {
    position: absolute;
    inset: 0;
    background: transparent;
    pointer-events: none;
    z-index: 0;
    transition: background 0.3s ease;
}

.screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    padding: clamp(16px, 4vw, 24px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s ease;
    box-sizing: border-box;
}

.screen.hidden {
    display: none !important;
    opacity: 0;
    pointer-events: none;
    z-index: -1;
}

.screen.active {
    display: flex !important;
    opacity: 1;
    z-index: 1;
}

.title {
    font-size: clamp(1.5rem, 6.5vw, 2rem);
    line-height: 1.15;
}

.neon-text {
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--text-color);
    margin-bottom: 4px;
    text-align: center;
}

h2.neon-text {
    font-size: clamp(1.15rem, 5vw, 1.45rem);
    color: var(--text-color);
    margin-bottom: 10px;
}

.title-kr {
    display: block;
    font-size: 0.65em;
    color: var(--text-muted);
    font-weight: 500;
    margin-top: 2px;
}

.subtitle {
    color: var(--text-muted);
    font-size: 0.82rem;
    margin-bottom: 16px;
    text-align: center;
}

/* ===== Main Menu ===== */
.main-menu-screen {
    padding: 0 !important;
    justify-content: flex-start !important;
}

.main-header {
    width: 100%;
    padding: calc(18px + env(safe-area-inset-top)) 16px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    border-bottom: 1px solid var(--border-subtle);
    background: radial-gradient(ellipse at 50% -15%, rgba(255, 77, 109, 0.2), rgba(129, 140, 248, 0.08) 55%, transparent 82%);
}

.main-header .title {
    font-size: clamp(1.4rem, 6.2vw, 1.85rem);
    margin-bottom: 0;
    font-weight: 900;
    background: linear-gradient(135deg, #ffffff 20%, #fda4af 65%, #ff4d6d 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.ad-banner {
    display: none !important;
}

.btn {
    font-family: var(--font-main);
    font-size: 0.95rem;
    font-weight: 700;
    padding: 13px 18px;
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.15s ease, filter 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
    border: none;
    outline: none;
    width: 100%;
}

.neon-btn {
    background: linear-gradient(180deg, #ff6b86 0%, #ff4d6d 55%, #e11d48 100%);
    color: #fff;
    border: none;
    white-space: nowrap;
    font-weight: 800;
    box-shadow: 0 4px 16px rgba(255, 77, 109, 0.35), 0 3px 0 #9f1239, inset 0 1px 0 rgba(255, 255, 255, 0.35);
}

.neon-btn:hover {
    filter: brightness(1.06);
}

.neon-btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 8px rgba(255, 77, 109, 0.3), 0 1px 0 #9f1239;
}

.neon-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

.btn-back {
    position: absolute;
    top: calc(14px + env(safe-area-inset-top));
    left: 16px;
    background: var(--surface-color);
    border: 1px solid var(--border-subtle);
    color: var(--text-color);
    font-family: var(--font-main);
    font-size: 0.8rem;
    font-weight: 700;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: background-color 0.15s;
    z-index: 100;
}

.btn-back:hover {
    background: var(--surface-hover);
}

/* Roulette Screen & Elements */
.roulette-screen,
#screen-settings {
    justify-content: flex-start !important;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding-top: calc(16px + env(safe-area-inset-top));
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
    background: var(--bg-color);
}

#screen-roulette.roulette-play-screen {
    justify-content: space-between !important;
    overflow: hidden;
    padding: calc(12px + env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom));
    gap: 8px;
}

.roulette-header-title {
    font-size: 1.05rem;
    font-weight: 900;
    color: var(--text-color);
    letter-spacing: -0.02em;
}

.roulette-stage {
    flex: 1;
    width: 100%;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px 0;
}

.roulette-container {
    position: relative;
    width: min(92vw, 430px, 58dvh);
    height: min(92vw, 430px, 58dvh);
    flex-shrink: 0;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

.roulette-wheel-wrapper {
    width: 100%;
    height: 100%;
    position: relative;
    border-radius: 50%;
    padding: 8px;
    background: conic-gradient(from 0deg, #ff4d6d, #f59e0b, #38bdf8, #a855f7, #ff4d6d);
    box-shadow: 0 0 28px rgba(255, 77, 109, 0.28), 0 10px 28px rgba(0, 0, 0, 0.5);
    box-sizing: border-box;
}

.roulette-wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 3px solid #111318;
    position: relative;
    overflow: hidden;
    transition: transform 3.6s cubic-bezier(0.12, 0.88, 0.32, 1);
    box-sizing: border-box;
}

.roulette-center-hub {
    position: absolute;
    top: 50%;
    left: 50%;
    width: clamp(58px, 15vw, 72px);
    height: clamp(58px, 15vw, 72px);
    padding: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #334155, #0f172a);
    transform: translate(-50%, -50%);
    border: 3px solid #ffffff;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    font-family: var(--font-main);
    transition: transform 0.12s ease;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.6), 0 0 16px rgba(255, 77, 109, 0.5);
}

.roulette-center-hub:active {
    transform: translate(-50%, -50%) scale(0.92);
}

.roulette-center-hub-icon {
    font-size: 1rem;
    line-height: 1;
}

.roulette-center-hub-text {
    font-size: 0.72rem;
    font-weight: 900;
    letter-spacing: 0.06em;
    color: #fff;
}

.roulette-slice-label {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    transform-origin: center center;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: clamp(18px, 4.8vw, 28px);
    font-weight: 900;
    font-size: clamp(0.84rem, 3.1vw, 1.04rem);
    color: #ffffff;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.88);
    pointer-events: none;
    box-sizing: border-box;
    letter-spacing: -0.02em;
}

/* Minimal Pointer */
.roulette-pointer {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 30px solid var(--primary-neon);
    filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.6));
    z-index: 20;
    transform-origin: 50% 0%;
    transition: transform 0.05s ease;
}

.roulette-bottom-bar {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
}

.roulette-count-hint {
    text-align: center;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text-muted);
}

/* Quick Presets */
.roulette-presets-container {
    width: 100%;
    max-width: 440px;
    margin-bottom: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.roulette-presets-title {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--text-muted);
}

.roulette-preset-chips,
.editor-presets {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: flex-start;
}

.roulette-chip-btn,
.preset-chip {
    background: var(--surface-color);
    border: 1px solid var(--border-subtle);
    color: var(--text-muted);
    font-family: var(--font-main);
    font-size: 0.75rem;
    font-weight: 700;
    padding: 6px 11px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.15s ease;
}

.roulette-chip-btn:hover,
.preset-chip:hover:not(:disabled) {
    border-color: var(--border-strong);
    color: var(--text-color);
}

.roulette-chip-btn.active,
.preset-chip.active {
    border-color: var(--primary-neon);
    background: var(--primary-neon);
    color: #fff;
}

.preset-chip.has-saved {
    border-color: rgba(255, 255, 255, 0.25);
    color: #fff;
}

.preset-chip.saved-flash {
    border-color: #10b981;
    background: rgba(16, 185, 129, 0.2);
    color: #34d399;
}

.preset-chip:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

/* Roulette Result Banner */
.roulette-result-card {
    margin-top: 10px;
    width: 100%;
    max-width: 440px;
    min-height: 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px 14px;
    border-radius: 12px;
    background: var(--surface-color);
    border: 1px solid var(--border-subtle);
}

.roulette-result-card.has-result {
    border-color: var(--primary-neon);
    animation: result-card-pop 0.3s ease-out;
}

@keyframes result-card-pop {
    0% { transform: scale(0.95); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}

.result-text {
    margin-top: 0;
    font-size: 1rem;
    font-weight: 800;
    color: var(--text-color);
    text-align: center;
    word-break: keep-all;
}

.i18n-sub {
    display: block;
    font-size: 0.72em;
    font-weight: 500;
    color: var(--text-muted);
    margin-top: 3px;
}

/* Settings */
.settings-container {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.setting-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.setting-group label {
    color: var(--text-muted);
    font-weight: 700;
    font-size: 0.8rem;
}

textarea {
    background: var(--surface-color);
    border: 1px solid var(--border-strong);
    color: var(--text-color);
    font-family: var(--font-main);
    padding: 10px 12px;
    border-radius: 12px;
    resize: none;
    outline: none;
    font-size: 0.9rem;
    width: 100%;
    max-width: 440px;
}

textarea:focus {
    border-color: var(--primary-neon);
}

.save-btn {
    margin-top: 4px;
}

.msg-text {
    text-align: center;
    color: #34d399;
    min-height: 1.2rem;
    font-weight: 700;
    font-size: 0.8rem;
}

/* Player Setup */
.player-setup {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 0;
    background: var(--surface-color);
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--border-subtle);
}

.player-label {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text-muted);
}

.player-count-val {
    font-size: 0.9rem;
    font-weight: 800;
    color: var(--text-color);
    min-width: 22px;
    text-align: center;
    font-variant-numeric: tabular-nums;
}

.cnt-btn {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--border-strong);
    background: var(--surface-hover);
    color: #fff;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: background-color 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
}

.cnt-btn:active {
    background: var(--primary-neon);
    border-color: var(--primary-neon);
}

/* Finger Roulette */
.finger-screen {
    justify-content: flex-start !important;
    padding-top: calc(16px + env(safe-area-inset-top));
    background: var(--bg-color);
}

#touch-title-neon {
    position: relative;
    z-index: 10;
    pointer-events: none;
    margin-bottom: 8px;
}

.touch-mode-tabs {
    position: relative;
    z-index: 30;
}

.finger-area {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 5;
    overflow: hidden;
    touch-action: none;
}

.finger-instructions {
    position: relative;
    z-index: 10;
    text-align: center;
    font-size: 0.9rem;
    color: var(--text-muted);
    pointer-events: none;
    margin-top: 8px;
    line-height: 1.4;
}

.finger-countdown {
    display: inline-block;
    font-size: clamp(3rem, 18vw, 5rem);
    font-weight: 900;
    color: var(--primary-neon);
    animation: countdown-pop 0.4s ease;
}

@keyframes countdown-pop {
    0% { transform: scale(1.4); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}

#screen-finger.flash {
    animation: finger-flash 0.35s ease 2;
}

@keyframes finger-flash {
    0%, 100% { background-color: var(--bg-color); }
    50% { background-color: rgba(255, 77, 109, 0.18); }
}

.finger-circle {
    position: absolute;
    width: 78px;
    height: 78px;
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0);
    animation: finger-pop 0.25s forwards;
    pointer-events: none;
    border: 3px solid #fff;
}

@keyframes finger-pop {
    to { transform: translate(-50%, -50%) scale(1); }
}

.finger-circle.loser {
    background: rgba(255, 77, 109, 0.35);
    border-color: var(--primary-neon);
    box-shadow: 0 0 28px rgba(255, 77, 109, 0.6);
    animation: finger-pulse 0.5s infinite alternate;
    z-index: 20;
}

@keyframes finger-pulse {
    from { transform: translate(-50%, -50%) scale(1); }
    to { transform: translate(-50%, -50%) scale(1.16); }
}

.shake {
    animation: screen-shake 0.45s cubic-bezier(.36,.07,.19,.97) both;
}

@keyframes screen-shake {
    10%, 90% { transform: translate3d(-2px, 0, 0); }
    20%, 80% { transform: translate3d(4px, 0, 0); }
    30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
    40%, 60% { transform: translate3d(8px, 0, 0); }
}

.couple-center-emblem {
    position: absolute;
    transform: translate(-50%, -50%);
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    animation: couple-heart-thump 0.75s ease-in-out infinite alternate;
}

@keyframes couple-heart-thump {
    0% { transform: translate(-50%, -50%) scale(0.95); }
    100% { transform: translate(-50%, -50%) scale(1.1); }
}

.couple-emblem-core {
    position: relative;
    background: var(--primary-neon);
    border: 2px solid #fff;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* ===== HOT 모드 ===== */
.hot-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px;
    border-radius: 14px;
    background: var(--surface-color);
    border: 1px solid var(--border-subtle);
}

.hot-text { flex: 1; min-width: 0; }

.hot-name {
    display: block;
    font-size: 0.9rem;
    font-weight: 800;
    color: var(--text-color);
}

.hot-19 {
    display: inline-block;
    margin-left: 4px;
    padding: 1px 6px;
    border-radius: 6px;
    background: var(--primary-neon);
    color: #fff;
    font-size: 0.62rem;
    font-weight: 800;
    vertical-align: middle;
}

.hot-desc {
    display: block;
    margin-top: 3px;
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--text-muted);
    line-height: 1.4;
    word-break: keep-all;
}

.hot-switch {
    flex-shrink: 0;
    width: 48px;
    height: 28px;
    border: none;
    outline: none;
    cursor: pointer;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.16);
    position: relative;
    transition: background 0.2s;
}

.hot-switch span {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.3, 1);
}

.hot-switch.on {
    background: var(--primary-neon);
}

.hot-switch.on span { transform: translateX(20px); }

.hot-badge {
    display: inline-block;
    vertical-align: middle;
    margin-left: 6px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--primary-neon);
    color: #fff;
    font-size: 0.45em;
    font-weight: 800;
}

.hot-badge.hidden { display: none; }

/* ===== Direct HOT Toggle & Controls Row ===== */
.header-controls-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
}

.hot-toggle-btn {
    border: 1px solid var(--border-subtle);
    outline: none;
    cursor: pointer;
    background: var(--surface-color);
    border-radius: 999px;
    padding: 5px 12px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: var(--font-main);
    font-size: 0.76rem;
    font-weight: 700;
    color: var(--text-muted);
    transition: all 0.15s ease;
}

.hot-toggle-btn:active {
    transform: scale(0.95);
}

body.hot {
    --primary-neon: #e11d48;
}

body.hot .aurora-bg {
    background: radial-gradient(circle at 50% 0%, rgba(225, 29, 72, 0.14), transparent 60%);
}

body.hot .hot-toggle-btn {
    background: var(--primary-neon);
    border-color: var(--primary-neon);
    color: #fff;
}

/* Footer */
.footer-copyright {
    position: absolute;
    bottom: calc(8px + env(safe-area-inset-bottom));
    left: 0;
    width: 100%;
    text-align: center;
    color: rgba(255, 255, 255, 0.28);
    font-size: 0.72rem;
    pointer-events: none;
    z-index: 100;
}

.gear-btn {
    border: 1px solid var(--border-subtle);
    outline: none;
    cursor: pointer;
    background: var(--surface-color);
    border-radius: 999px;
    padding: 5px 11px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: var(--font-main);

const soundFX = {
    ctx: null,
    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    },
    playTone(freq, type, duration, vol=0.1) {
        if(!this.ctx) return;
        try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(vol, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        } catch(e){}
    },
    playTick(high = false) {
        this.init();
        this.playTone(high ? 1300 : 850, 'sine', 0.08, 0.06);
    },
    playHeartbeat() {
        this.init();
        this.playTone(85, 'sine', 0.12, 0.18);
        setTimeout(() => this.playTone(65, 'sine', 0.18, 0.14), 140);
    },
    playBoom() {
        this.init();
        if(!this.ctx) return;
        const bufferSize = this.ctx.sampleRate * 2;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 1000;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 1.5);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start();
    },
    playCardFlip() {
        this.playFlip();
    },
    playFlip() {
        this.init();
        this.playTone(400, 'triangle', 0.08, 0.1);
        setTimeout(() => this.playTone(600, 'triangle', 0.15, 0.1), 70);
    },
    playTada() {
        this.init();
        this.playTone(523.25, 'sine', 0.12, 0.1);
        setTimeout(() => this.playTone(659.25, 'sine', 0.12, 0.1), 120);
        setTimeout(() => this.playTone(783.99, 'sine', 0.15, 0.12), 240);
        setTimeout(() => this.playTone(1046.50, 'sine', 0.45, 0.15), 360);
    },
    playFail() {
        this.init();
        this.playTone(300, 'sawtooth', 0.25, 0.1);
        setTimeout(() => this.playTone(220, 'sawtooth', 0.45, 0.12), 220);
    },
    playSiren() {
        this.init();
        if(!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        const now = this.ctx.currentTime;
        for(let i=0; i<6; i++){
            osc.frequency.setValueAtTime(440, now + i*0.2);
            osc.frequency.linearRampToValueAtTime(880, now + i*0.2 + 0.1);
        }
        osc.start();
        osc.stop(now + 1.2);
    },
    playBigBoom() {
        this.init();
        this.playBoom();
        setTimeout(() => this.playTone(110, 'square', 0.4, 0.2), 40);
        setTimeout(() => this.playTone(1400, 'sine', 0.15, 0.1), 80);
    },
    playChomp() {
        this.init();
        this.playTone(120, 'sawtooth', 0.15, 0.2);

    },

        this.init();
        this.playTone(1800 + Math.random()*400, 'sawtooth', 0.05, 0.05);
    }
};

/* ===== Global FX Particle Engine ===== */
const fxEngine = {
    canvas: null,
    ctx: null,
    particles: [],
    width: 0,
    height: 0,
    running: false,
    reduced: false,
    init() {
        this.canvas = document.getElementById('gijo-fx-canvas');
        if (!this.canvas) return;
        this.ctx = this.canvas.getContext('2d');
        try {
            const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
            this.reduced = mq.matches;
            if (mq.addEventListener) mq.addEventListener('change', (e) => { this.reduced = e.matches; });
        } catch (e) {}
        this.resize();
        window.addEventListener('resize', () => this.resize());
    },
    resize() {
        if (!this.canvas) return;
        this.width = this.canvas.width = window.innerWidth;
        this.height = this.canvas.height = window.innerHeight;
    },
    scaled(count) {
        return this.reduced ? Math.max(3, Math.ceil(count / 3)) : count;
    },
    kick() {
        if (this.particles.length > 600) this.particles.splice(0, this.particles.length - 600);
        if (this.running || !this.ctx) return;
        this.running = true;
        requestAnimationFrame(() => this.loop());
    },
    confetti(x = this.width / 2, y = this.height / 2, count = 70) {
        const colors = ['#ff0055', '#00f3ff', '#a200ff', '#ffaa00', '#00ffaa', '#ffffff', '#ff007f'];
        count = this.scaled(count);
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 4 + Math.random() * 9;
            this.particles.push({
                type: 'confetti',
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 3,
                size: 6 + Math.random() * 6,
                color: colors[Math.floor(Math.random() * colors.length)],
                rotation: Math.random() * 360,
                rotSpeed: (Math.random() - 0.5) * 15,
                alpha: 1,
                decay: 0.012 + Math.random() * 0.008,
                gravity: 0.22
            });
        }
        this.kick();
    },
    sparks(x, y, count = 25, color = '#ff0055') {
        count = this.scaled(count);
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 2 + Math.random() * 6;
            this.particles.push({
                type: 'spark',
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                size: 2 + Math.random() * 3,
                color,
                alpha: 1,
                decay: 0.03 + Math.random() * 0.02,
                gravity: 0.1
            });
        }
        this.kick();
    },
    heartBurst(x, y, count = 15) {
        count = this.scaled(count);
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 2 + Math.random() * 5;
            this.particles.push({
                type: 'heart',
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 2,
                size: 14 + Math.random() * 10,
                alpha: 1,
                decay: 0.015,
                gravity: 0.08
            });
        }
        this.kick();
    },
    splash(x, y, count = 20) {
        count = this.scaled(count);
        for (let i = 0; i < count; i++) {
            const angle = Math.PI * 1.2 + Math.random() * Math.PI * 0.6;
            const speed = 3 + Math.random() * 7;
            this.particles.push({
                type: 'splash',
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                size: 3 + Math.random() * 4,
                color: '#00f3ff',
                alpha: 1,
                decay: 0.025,
                gravity: 0.3
            });
        }
        this.kick();
    },
    loop() {
        if (this.ctx) {
            this.ctx.clearRect(0, 0, this.width, this.height);
            if (this.particles.length === 0) {
                this.running = false;
                return;
            }
            for (let i = this.particles.length - 1; i >= 0; i--) {
                const p = this.particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity || 0;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    this.particles.splice(i, 1);
                    continue;
                }

                this.ctx.save();
                this.ctx.globalAlpha = Math.max(0, p.alpha);

                if (p.type === 'confetti') {
                    p.rotation += p.rotSpeed;
                    this.ctx.translate(p.x, p.y);
                    this.ctx.rotate((p.rotation * Math.PI) / 180);
                    this.ctx.fillStyle = p.color;
                    this.ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
                } else if (p.type === 'spark') {
                    this.ctx.fillStyle = p.color;
                    this.ctx.shadowColor = p.color;
                    this.ctx.shadowBlur = 8;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fill();
                } else if (p.type === 'heart') {
                    this.ctx.font = `${p.size}px sans-serif`;
                    this.ctx.textAlign = 'center';
                    this.ctx.textBaseline = 'middle';
                    this.ctx.fillText('💖', p.x, p.y);
                } else if (p.type === 'splash') {
                    this.ctx.fillStyle = p.color;
                    this.ctx.shadowColor = p.color;
                    this.ctx.shadowBlur = 6;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fill();
                }
                this.ctx.restore();
            }
        }
        requestAnimationFrame(() => this.loop());
    }
};

    bindMouseFingerFallback(area, key, onAdd, onRemoveNear) {
        if (this[key]) {
            area.removeEventListener('mousedown', this[key]);
            this[key] = null;
        }
        if (!this.isMouseOnlyDevice()) return;
        let seq = 0;
        this[key] = (e) => {
            if (e.button !== 0) return;
            e.preventDefault();
            if (onRemoveNear(e.clientX, e.clientY)) return;
            onAdd('m' + (seq++), e.clientX, e.clientY);

        area.addEventListener('mousedown', this[key]);

    /* ============================================================
       1. MISSION ROULETTE LOGIC
       ============================================================ */
    setRoulettePreset(presetName) {},

    updateRouletteWheel(options) {
        const wheel = document.getElementById('roulette-wheel');
        const hint = document.getElementById('roulette-count-hint');
        if (hint) {
            hint.textContent = `벌칙 ${options.length}개 · 룰렛이나 아래 버튼을 눌러 돌리세요`;
        }
        if (!wheel) return;
        const oldLabels = wheel.querySelectorAll('.roulette-slice-label');
        oldLabels.forEach(el => el.remove());

        const colors = ['#ff4d6d', '#6366f1', '#0ea5e9', '#f59e0b', '#10b981', '#ec4899', '#8b5cf6', '#f97316'];
        const gradient = [];
        const count = options.length;
        const angle = 360 / count;

        for (let i = 0; i < count; i++) {
            const color = colors[i % colors.length];
            gradient.push(`${color} ${i * angle}deg ${(i + 1) * angle}deg`);

            const label = document.createElement('div');
            label.className = 'roulette-slice-label';
            const rotateDeg = (i * angle) + (angle / 2);
            label.style.transform = `rotate(${rotateDeg}deg)`;

            let text = options[i];
            if (text.length > 13) text = text.substring(0, 12) + '..';
            label.innerText = text;

            wheel.appendChild(label);
        }
        wheel.style.background = `conic-gradient(${gradient.join(', ')})`;
    },

    spinRoulette() {
        if (this.isSpinning) return;
        const wheel = document.getElementById('roulette-wheel');
        const optionsToUse = this.currentMissionRouletteOptions;
        if (!wheel || !optionsToUse || optionsToUse.length < 2) return;
        this.isSpinning = true;

        const pointer = document.getElementById('roulette-pointer');
        const spinBtn = document.getElementById('roulette-spin-btn');
        if (spinBtn) spinBtn.disabled = true;

        const modal = document.getElementById('roulette-winner-modal');
        if (modal) modal.classList.remove('show');

        soundFX.init();
        haptics.tick();

        const spins = 6 + Math.random() * 5;
        const extraDegrees = Math.random() * 360;
        this.rouletteRotation += (spins * 360) + extraDegrees;

        wheel.style.transform = `rotate(${this.rouletteRotation}deg)`;

        let currentInterval = 55;
        const startTime = Date.now();
        const spinDuration = 3600;

        const runTick = () => {
            if (!this.isSpinning) return;
            const elapsed = Date.now() - startTime;
            if (elapsed >= spinDuration) return;

            soundFX.playTick(elapsed > 2500);
            haptics.tick();
            if (pointer) {
                pointer.classList.remove('tick-bounce');
                void pointer.offsetWidth;
                pointer.classList.add('tick-bounce');
            }

            const p = elapsed / spinDuration;
            currentInterval = 55 + Math.pow(p, 2.5) * 400;
            this.rouletteTickTimer = setTimeout(runTick, currentInterval);
        };
        runTick();

        this.rouletteSpinTimer = setTimeout(() => {
            clearTimeout(this.rouletteTickTimer);
            this.rouletteTickTimer = null;
            this.rouletteSpinTimer = null;
            this.isSpinning = false;
            if (spinBtn) spinBtn.disabled = false;

            const normalizedDegrees = this.rouletteRotation % 360;
            const segmentAngle = 360 / optionsToUse.length;
            const segmentIndex = Math.floor(((360 - normalizedDegrees) % 360) / segmentAngle);
            const winner = optionsToUse[segmentIndex] || '당첨 벌칙!';
            this.lastRouletteWinner = winner;

            soundFX.playTada();
            haptics.buildUp();

            const rect = wheel.getBoundingClientRect();
            fxEngine.confetti(rect.left + rect.width / 2, rect.top + rect.height / 2, 100);

            setTimeout(() => {
                this.openRouletteWinner(winner);
            }, 200);
        }, spinDuration);
    },

    openRouletteWinner(winner) {
        const modal = document.getElementById('roulette-winner-modal');
        const title = document.getElementById('roulette-winner-title');
        const sub = document.getElementById('roulette-winner-sub');
        if (!modal) return;
        if (title) title.textContent = winner;
        if (sub) {
            sub.textContent = '피할 수 없는 오늘의 벌칙! 당당하게 수행하세요 🍻';
        }
        modal.classList.add('show');
    },

    closeRouletteWinner(removeThisPenalty = false) {
        const modal = document.getElementById('roulette-winner-modal');
        if (modal) modal.classList.remove('show');

        if (removeThisPenalty && this.lastRouletteWinner) {
            if (this.currentMissionRouletteOptions.length <= 2) {
                alert('룰렛 유지를 위해 최소 2개의 벌칙이 필요합니다!');
                return;
            }
            const idx = this.currentMissionRouletteOptions.indexOf(this.lastRouletteWinner);
            if (idx > -1) {
                this.currentMissionRouletteOptions.splice(idx, 1);
                this.currentMissions = [...this.currentMissionRouletteOptions];
                this.autoSaveCustomMissions();
                this.updateRouletteWheel(this.currentMissionRouletteOptions);
                soundFX.playSpark();
                haptics.tick();
            }
        }
    },

    /* ============================================================
       2. TOUCH ROULETTE & LOVE DRINK LOGIC
       ============================================================ */
    fingerIdleMessage() {
        const pcHint = this.isMouseOnlyDevice() ? ' · PC: 클릭하여 손가락 배치' : '';
        if (this.touchMode === 'love') {
            return `💖 운명의 19+ 커플 매칭! 손가락을 올려주세요!<span class="i18n-sub">Everyone touch and hold for 19+ couple match!${pcHint}</span>`;
        }
        return `🍺 다같이 화면을 누르고 계세요! (2~6인)<span class="i18n-sub">Everyone touch and hold the screen!${pcHint}</span>`;
    },

    setFingerMessage(html) {
        const msg = document.getElementById('finger-msg');
        if (msg) msg.innerHTML = html;
    },

    setTouchMode(mode) {
        this.touchMode = mode;
        const tabDrink = document.getElementById('touch-tab-drink');
        const tabLove = document.getElementById('touch-tab-love');
        const title = document.getElementById('touch-title-neon');

        if (tabLove) tabLove.classList.toggle('active', mode === 'love');

        }

    clearFingerTimers() {
        if (this.fingerTimer) {
            clearTimeout(this.fingerTimer);
            this.fingerTimer = null;
        }
        if (this.fingerCountdownInterval) {
            clearInterval(this.fingerCountdownInterval);

        }

        }

    clearFingerCountdown() {
        if (this.fingerTimer) {
            clearTimeout(this.fingerTimer);
            this.fingerTimer = null;
        }
        if (this.fingerCountdownInterval) {
            clearInterval(this.fingerCountdownInterval);

        }
    },

    setupFingerRoulette() {
        soundFX.init();
        const area = document.getElementById('finger-area');
        if (!area) return;

        area.innerHTML = '';
        this.fingerTouches = {};
        this.fingerIsActive = false;
        this.clearFingerTimers();
        this.setFingerMessage(this.fingerIdleMessage());

        this.teardownFingerEvents();

        this.handleFingerStart = this.handleFingerStart.bind(this);
        this.handleFingerMove = this.handleFingerMove.bind(this);
        this.handleFingerEnd = this.handleFingerEnd.bind(this);

        area.addEventListener('touchstart', this.handleFingerStart, { passive: false });
        area.addEventListener('touchmove', this.handleFingerMove, { passive: false });
        area.addEventListener('touchend', this.handleFingerEnd, { passive: false });
        area.addEventListener('touchcancel', this.handleFingerEnd, { passive: false });

        // 데스크톱 마우스 폴백
        this.bindMouseFingerFallback(area, '_fingerMouseHandler',
            (id, clientX, clientY) => {
                if (this.fingerIsActive) return;
                this.addFingerTouch(id, clientX, clientY);
                this.checkFingerRouletteStart();
            },
            (clientX, clientY) => {
                if (this.fingerIsActive) return true;
                const id = this.findTouchNear(this.fingerTouches, clientX, clientY, 44);
                if (id === null) return false;
                this.removeFingerTouch(id);
                this.checkFingerRouletteStart();
                return true;
            }
        );
    },

    teardownFingerEvents() {
        this.clearFingerTimers();
        const area = document.getElementById('finger-area');
        if (!area) return;
        if (this.handleFingerStart) {
            area.removeEventListener('touchstart', this.handleFingerStart);
            area.removeEventListener('touchmove', this.handleFingerMove);
            area.removeEventListener('touchend', this.handleFingerEnd);
            area.removeEventListener('touchcancel', this.handleFingerEnd);
        }
        if (this._fingerMouseHandler) {
            area.removeEventListener('mousedown', this._fingerMouseHandler);
            this._fingerMouseHandler = null;
        }
    },

    addFingerTouch(id, clientX, clientY) {
        const area = document.getElementById('finger-area');
        if (!area || this.fingerTouches[id]) return;
        const rect = area.getBoundingClientRect();
        const x = clientX - rect.left;
        const y = clientY - rect.top;

        const usedColors = new Set(Object.values(this.fingerTouches).map(t => t.color));
        const color = this.fingerColors.find(c => !usedColors.has(c)) || this.fingerColors[Object.keys(this.fingerTouches).length % this.fingerColors.length];

        const circle = document.createElement('div');
        circle.className = 'finger-circle';
        circle.style.left = `${x}px`;
        circle.style.top = `${y}px`;
        circle.style.borderColor = color;
        circle.style.boxShadow = `0 0 25px ${color}, inset 0 0 20px ${color}`;

        area.appendChild(circle);

        this.fingerTouches[id] = { id, x, y, clientX, clientY, color, el: circle };

        soundFX.playSpark();
        haptics.tick();
        fxEngine.sparks(clientX, clientY, 12, color);
    },

    moveFingerTouch(id, clientX, clientY) {
        const tracked = this.fingerTouches[id];
        if (!tracked) return;
        const area = document.getElementById('finger-area');
        if (!area) return;
        const rect = area.getBoundingClientRect();

        tracked.clientX = clientX;
        tracked.clientY = clientY;
        tracked.x = clientX - rect.left;
        tracked.y = clientY - rect.top;
        tracked.el.style.left = `${tracked.x}px`;
        tracked.el.style.top = `${tracked.y}px`;
    },

    removeFingerTouch(id) {
        const tracked = this.fingerTouches[id];
        if (!tracked) return;
        if (tracked.el) tracked.el.remove();
        delete this.fingerTouches[id];
    },

    handleFingerStart(e) {
        e.preventDefault();
        if (this.fingerIsActive) return;
        soundFX.init();

        for (let i = 0; i < e.changedTouches.length; i++) {
            const touch = e.changedTouches[i];
            this.addFingerTouch(touch.identifier, touch.clientX, touch.clientY);
        }

        this.checkFingerRouletteStart();
    },

    handleFingerMove(e) {
        e.preventDefault();
        if (this.fingerIsActive) return;

        for (let i = 0; i < e.changedTouches.length; i++) {
            const touch = e.changedTouches[i];
            this.moveFingerTouch(touch.identifier, touch.clientX, touch.clientY);
        }
    },

    handleFingerEnd(e) {
        e.preventDefault();
        if (this.fingerIsActive) return;

        for (let i = 0; i < e.changedTouches.length; i++) {
            this.removeFingerTouch(e.changedTouches[i].identifier);
        }

        this.checkFingerRouletteStart();
    },

    checkFingerRouletteStart() {
        const count = Object.keys(this.fingerTouches).length;

        if (count < 2) {
            this.clearFingerCountdown();
            this.fingerIsActive = false;
            this.setFingerMessage(
                count === 1
                    ? '⚡ 손가락 1개 감지! 한 명 더 올려주세요!<span class="i18n-sub">Need at least 2 players!</span>'
                    : this.fingerIdleMessage()
            );
            return;
        }

        if (this.fingerCountdownInterval) {
            return;
        }

        let secondsLeft = 3;
        const updateCountdownMsg = (sec) => {
            this.setFingerMessage(
                `⚡ 3초 후 결정! 손가락을 떼지 마세요! <span class="finger-countdown">${sec}</span><span class="i18n-sub">Hold on! Deciding in ${sec}s... (${count} players)</span>`
            );
        };

        updateCountdownMsg(secondsLeft);
        soundFX.playTick();
        haptics.tick();

        this.fingerCountdownInterval = setInterval(() => {
            secondsLeft--;
            if (secondsLeft > 0) {
                updateCountdownMsg(secondsLeft);
                soundFX.playTick();
                haptics.tick();
            } else {
                this.clearFingerCountdown();
                this.fingerIsActive = true;
                this.finishFingerRoulette();
            }
        }, 1000);
    },

    closeTouchPenalty() {
        const modal = document.getElementById('touch-penalty-modal');
        if (modal) modal.classList.remove('show');
        soundFX.playTick();
        const area = document.getElementById('finger-area');
        if (area) area.innerHTML = '';
        this.fingerTouches = {};
        this.fingerIsActive = false;
        this.clearFingerTimers();
        this.setFingerMessage(this.fingerIdleMessage());
    },

    closeLoveMission() {
        const modal = document.getElementById('love-mission-modal');
        if (modal) modal.classList.remove('show');
        soundFX.playTick();
        const area = document.getElementById('finger-area');
        if (area) area.innerHTML = '';
        this.fingerTouches = {};
        this.fingerIsActive = false;
        this.clearFingerTimers();
        this.setFingerMessage(this.fingerIdleMessage());
    },

    showLoveMission() {
        const mission = LOVE_MISSIONS[Math.floor(Math.random() * LOVE_MISSIONS.length)];
        const text = document.getElementById('love-mission-text');
        const modal = document.getElementById('love-mission-modal');
        if (text) text.innerText = mission;
        if (modal) modal.classList.add('show');
        haptics.heartbeat();
    },

    finishFingerRoulette() {
        const keys = Object.keys(this.fingerTouches);
        if (keys.length < 2) return;

        if (this.touchMode === 'love') {
            this.runTouchLoveMatch(keys);
            return;
        }

        // DRINK MODE: Pick 1 loser
        const shuffled = [...keys].sort(() => Math.random() - 0.5);
        const loserKey = shuffled[0];

        keys.forEach(k => {
            if (k !== loserKey) {
                if (this.fingerTouches[k] && this.fingerTouches[k].el) {
                    this.fingerTouches[k].el.remove();
                }
            } else {
                const el = this.fingerTouches[k].el;
                el.className = 'finger-circle loser';
                const rect = el.getBoundingClientRect();
                fxEngine.sparks(rect.left + rect.width / 2, rect.top + rect.height / 2, 60, '#ff0055');
            }
        });

        this.setFingerMessage('💥 당첨! 벌칙 미션 확인! 💥<span class="i18n-sub">You are chosen! Check your mission!</span>');
        soundFX.playBigBoom();
        haptics.loser();

        const screen = document.getElementById('screen-finger');
        if (screen) {
            screen.classList.remove('shake', 'flash');
            void screen.offsetWidth;
            screen.classList.add('shake', 'flash');
        }

        const chosen = this.touchPenaltyItems[Math.floor(Math.random() * this.touchPenaltyItems.length)];
        const modal = document.getElementById('touch-penalty-modal');
        const pTitle = document.getElementById('touch-penalty-title');
        const pDesc = document.getElementById('touch-penalty-desc');
        if (pTitle) pTitle.textContent = chosen.title;
        if (pDesc) pDesc.textContent = chosen.desc;
        if (modal) {
            this.fingerResultTimer = setTimeout(() => {
                if (this.currentScreen === 'finger') modal.classList.add('show');
            }, 700);
        }
    },

    runTouchLoveMatch(keys) {
        const nodes = Object.values(this.fingerTouches);
        if (nodes.length < 2) return;

        const shuffled = [...nodes].sort(() => Math.random() - 0.5);
        const p1 = shuffled[0];
        const p2 = shuffled[1];

        nodes.forEach(n => {
            if (n !== p1 && n !== p2) {
                n.el.style.opacity = '0.2';
                n.el.style.transform = 'scale(0.8)';
            }
        });

        const area = document.getElementById('finger-area');
        if (!area) return;

        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.style.position = 'absolute';
        svg.style.inset = '0';
        svg.style.width = '100%';
        svg.style.height = '100%';
        svg.style.pointerEvents = 'none';
        svg.style.zIndex = '5';
        svg.innerHTML = `
            <defs>
                <linearGradient id="touchLoveGrad" x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#ff0055" />
                    <stop offset="50%" stop-color="#ffd700" />
                    <stop offset="100%" stop-color="#ff007f" />
                </linearGradient>
            </defs>
            <line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="#ff007f" stroke-width="14" stroke-opacity="0.45" />
            <line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="url(#touchLoveGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 6" />
        `;
        area.appendChild(svg);

        p1.el.className = 'finger-circle loser';
        p2.el.className = 'finger-circle loser';

        const midX = (p1.x + p2.x) / 2;
        const midY = (p1.y + p2.y) / 2;
        const emblem = document.createElement('div');
        emblem.className = 'couple-center-emblem';
        emblem.style.left = midX + 'px';
        emblem.style.top = midY + 'px';
        emblem.innerHTML = `
            <div class="couple-emblem-core" style="background:#ff0055; width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 0 20px #ff0055;">
                <span style="font-size:1.5rem;">💘</span>
            </div>
            <div style="font-size:0.75rem; font-weight:900; color:#ffd700; background:rgba(0,0,0,0.7); padding:2px 8px; border-radius:10px; margin-top:4px;">100% MATCH</div>
        `;
        area.appendChild(emblem);

        const areaRect = area.getBoundingClientRect();
        soundFX.playTada();
        haptics.buildUp();
        fxEngine.heartBurst(areaRect.left + midX, areaRect.top + midY, 35);

        this.setFingerMessage('💖 19+ 커플 매칭 완료! 미션을 확인하세요! 💖<span class="i18n-sub">Couple matched! Check your love mission!</span>');

        this.fingerResultTimer = setTimeout(() => {
            if (this.currentScreen === 'finger') this.showLoveMission();
        }, 1200);
    },

    /* ============================================================
       3. SETTINGS
       ============================================================ */
    saveSettings() {
        const sr = document.getElementById('setting-roulette');
        this.customRouletteText = sr ? sr.value.trim() : '';
        this.storeSet('neonDrinks_customRoulette', this.customRouletteText);

        const ri = document.getElementById('roulette-input-text');
        if (ri) ri.value = this.customRouletteText;

        soundFX.playTada();
        haptics.buildUp();
        fxEngine.confetti(window.innerWidth / 2, window.innerHeight / 2, 50);
        const msg = document.getElementById('settings-msg');
        if (msg) {
            msg.innerText = '✅ 저장 완료! · Settings Saved!';
            clearTimeout(this.settingsMsgTimer);
            this.settingsMsgTimer = setTimeout(() => { msg.innerText = ''; }, 2000);
        }
    }
};

window.app = app;
window.addEventListener('DOMContentLoaded', () => {
    app.init();
});
</script>
</body>
</html>
